<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLanlyCalendear</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #0a0000;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 32px;
    }

    .add-btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    .add-btn:hover {
      background: #4338ca;
    }

    /* Calendar controls */
    .calendar-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 18px;
      border-radius: 12px 12px 0 0;
      border-bottom: 1px solid #ddd;
    }

    .month-title {
      font-size: 22px;
      font-weight: bold;
    }

    .nav-buttons button {
      border: 1px solid #ddd;
      background: white;
      padding: 8px 13px;
      margin-left: 5px;
      border-radius: 7px;
      cursor: pointer;
    }

    .nav-buttons button:hover {
      background: #f1f1f1;
    }

    /* Calendar */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: white;
      border-radius: 0 0 12px 12px;
      overflow: hidden;
    }

    .day-name {
      text-align: center;
      padding: 12px;
      background: #f8fafc;
      font-weight: bold;
      color: #666;
      border-right: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .day {
      min-height: 130px;
      padding: 8px;
      border-right: 1px solid #eee;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .day:hover {
      background: #fafafa;
    }

    .day-number {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .today .day-number {
      background: #4f46e5;
      color: white;
      width: 27px;
      height: 27px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
    }

    .event {
      padding: 5px 7px;
      margin-bottom: 4px;
      border-radius: 5px;
      font-size: 12px;
      color: white;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .other-month {
      color: #bbb;
      background: #fafafa;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 450px;
      border-radius: 15px;
      padding: 25px;
    }

    .modal h2 {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .cancel-btn,
    .save-btn {
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .cancel-btn {
      background: #eee;
    }

    .save-btn {
      background: #4f46e5;
      color: white;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: auto;
      display: none;
    }

    /* Mobile */
    @media (max-width: 700px) {
      .container {
        margin: 10px auto;
        padding: 10px;
      }

      .header h1 {
        font-size: 24px;
      }

      .add-btn {
        padding: 9px 12px;
      }

      .day {
        min-height: 90px;
        padding: 5px;
      }

      .day-name {
        font-size: 11px;
        padding: 8px 2px;
      }

      .event {
        font-size: 10px;
        padding: 4px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>📅 My God damn Calendar</h1>
      <button class="add-btn" onclick="openAddModal()">
        + Add Event
      </button>
    </div>

    <div class="calendar-controls">

      <div class="month-title" id="monthTitle"></div>

      <div class="nav-buttons">
        <button onclick="previousMonth()">←</button>
        <button onclick="goToday()">Today</button>
        <button onclick="nextMonth()">→</button>
      </div>

    </div>

    <div class="calendar" id="calendar">

      <div class="day-name">Sun</div>
      <div class="day-name">Mon</div>
      <div class="day-name">Tue</div>
      <div class="day-name">Wed</div>
      <div class="day-name">Thu</div>
      <div class="day-name">Fri</div>
      <div class="day-name">Sat</div>

    </div>

  </div>


  <!-- Event Modal -->

  <div class="modal-overlay" id="modalOverlay">

    <div class="modal">

      <h2 id="modalTitle">Add Event</h2>

      <div class="form-group">
        <label>干点啥</label>
        <input type="text" id="eventName" placeholder="e.g. Blow Up the School">
      </div>

      <div class="form-group">
        <label>Date</label>
        <input type="date" id="eventDate">
      </div>

      <div class="form-group">
        <label>Time</label>
        <input type="time" id="eventTime">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="eventDescription"
          placeholder="C4 or grenade？"></textarea>
      </div>

      <div class="form-group">
        <label>Color</label>

        <select id="eventColor">
          <option value="#4f46e5">Blue</option>
          <option value="#10b981">Green</option>
          <option value="#f59e0b">Yellow</option>
          <option value="#ef4444">Red</option>
          <option value="#8b5cf6">Purple</option>
        </select>

      </div>

      <div class="modal-buttons">

        <button
          class="delete-btn"
          id="deleteButton"
          onclick="deleteEvent()">
          fuck off
        </button>

        <button
          class="cancel-btn"
          onclick="closeModal()">
          cancle
        </button>

        <button
          class="save-btn"
          onclick="saveEvent()">
          Save this shit
        </button>

      </div>

    </div>

  </div>


  <script>

    let currentDate = new Date();

    let events =
      JSON.parse(localStorage.getItem("calendarEvents")) || [];

    let selectedEventId = null;


    /* =========================
       Render Calendar
    ========================= */

    function renderCalendar() {

      const calendar = document.getElementById("calendar");

      const monthTitle = document.getElementById("monthTitle");

      calendar.innerHTML = `
        <div class="day-name">Sun</div>
        <div class="day-name">Mon</div>
        <div class="day-name">Tue</div>
        <div class="day-name">Wed</div>
        <div class="day-name">Thu</div>
        <div class="day-name">Fri</div>
        <div class="day-name">Sat</div>
      `;

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthName =
        currentDate.toLocaleString("default", {
          month: "long"
        });

      monthTitle.textContent =
        `${monthName} ${year}`;


      const firstDay =
        new Date(year, month, 1).getDay();

      const daysInMonth =
        new Date(year, month + 1, 0).getDate();

      const daysInPreviousMonth =
        new Date(year, month, 0).getDate();


      /* Previous month's days */

      for (let i = firstDay - 1; i >= 0; i--) {

        const dayNumber =
          daysInPreviousMonth - i;

        const cell =
          createDayCell(
            dayNumber,
            true,
            null
          );

        calendar.appendChild(cell);
      }


      /* Current month's days */

      for (let day = 1; day <= daysInMonth; day++) {

        const dateString =
          formatDate(
            new Date(year, month, day)
          );

        const cell =
          createDayCell(
            day,
            false,
            dateString
          );

        calendar.appendChild(cell);
      }


      /* Next month's days */

      const totalCells =
        calendar.children.length - 7;

      const remaining =
        42 - totalCells;

      for (let day = 1; day <= remaining; day++) {

        const cell =
          createDayCell(
            day,
            true,
            null
          );

        calendar.appendChild(cell);
      }

    }


    /* =========================
       Create Day Cell
    ========================= */

    function createDayCell(
      dayNumber,
      otherMonth,
      dateString
    ) {

      const cell =
        document.createElement("div");

      cell.className = "day";

      if (otherMonth) {
        cell.classList.add("other-month");
      }


      const number =
        document.createElement("div");

      number.className =
        "day-number";

      number.textContent =
        dayNumber;

      cell.appendChild(number);


      if (!otherMonth && dateString) {

        const today =
          formatDate(new Date());

        if (dateString === today) {
          cell.classList.add("today");
        }


        cell.onclick = function(e) {

          if (e.target === cell ||
              e.target === number) {

            openAddModal(dateString);

          }

        };


        const dayEvents =
          events.filter(
            event => event.date === dateString
          );


        dayEvents.forEach(event => {

          const eventElement =
            document.createElement("div");

          eventElement.className =
            "event";

          eventElement.style.background =
            event.color;

          eventElement.textContent =
            event.time
              ? `${event.time} ${event.name}`
              : event.name;


          eventElement.onclick =
            function(e) {

              e.stopPropagation();

              openEditModal(event.id);

            };


          cell.appendChild(eventElement);

        });

      }

      return cell;

    }


    /* =========================
       Date Helpers
    ========================= */

    function formatDate(date) {

      const year =
        date.getFullYear();

      const month =
        String(date.getMonth() + 1)
          .padStart(2, "0");

      const day =
        String(date.getDate())
          .padStart(2, "0");

      return `${year}-${month}-${day}`;

    }


    /* =========================
       Navigation
    ========================= */

    function previousMonth() {

      currentDate.setMonth(
        currentDate.getMonth() - 1
      );

      renderCalendar();

    }


    function nextMonth() {

      currentDate.setMonth(
        currentDate.getMonth() + 1
      );

      renderCalendar();

    }


    function goToday() {

      currentDate = new Date();

      renderCalendar();

    }


    /* =========================
       Open Add Modal
    ========================= */

    function openAddModal(date = null) {

      selectedEventId = null;

      document.getElementById("modalTitle")
        .textContent = "Add Event";

      document.getElementById("eventName")
        .value = "";

      document.getElementById("eventDate")
        .value =
        date || formatDate(new Date());

      document.getElementById("eventTime")
        .value = "";

      document.getElementById("eventDescription")
        .value = "";

      document.getElementById("eventColor")
        .value = "#4f46e5";

      document.getElementById("deleteButton")
        .style.display = "none";

      document.getElementById("modalOverlay")
        .style.display = "flex";

    }


    /* =========================
       Open Edit Modal
    ========================= */

    function openEditModal(id) {

      const event =
        events.find(
          event => event.id === id
        );

      if (!event) return;

      selectedEventId = id;

      document.getElementById("modalTitle")
        .textContent = "Edit Event";

      document.getElementById("eventName")
        .value = event.name;

      document.getElementById("eventDate")
        .value = event.date;

      document.getElementById("eventTime")
        .value = event.time;

      document.getElementById("eventDescription")
        .value = event.description;

      document.getElementById("eventColor")
        .value = event.color;

      document.getElementById("deleteButton")
        .style.display = "block";

      document.getElementById("modalOverlay")
        .style.display = "flex";

    }


    /* =========================
       Save Event
    ========================= */

    function saveEvent() {

      const name =
        document.getElementById("eventName")
          .value.trim();

      const date =
        document.getElementById("eventDate")
          .value;

      const time =
        document.getElementById("eventTime")
          .value;

      const description =
        document.getElementById("eventDescription")
          .value.trim();

      const color =
        document.getElementById("eventColor")
          .value;


      if (!name || !date) {

        alert(
          "Please enter an event name and date."
        );

        return;

      }


      if (selectedEventId) {

        const event =
          events.find(
            event => event.id === selectedEventId
          );

        event.name = name;
        event.date = date;
        event.time = time;
        event.description = description;
        event.color = color;

      } else {

        events.push({

          id: Date.now(),

          name: name,

          date: date,

          time: time,

          description: description,

          color: color

        });

      }


      localStorage.setItem(
        "calendarEvents",
        JSON.stringify(events)
      );


      closeModal();

      renderCalendar();

    }


    /* =========================
       Delete Event
    ========================= */

    function deleteEvent() {

      if (!selectedEventId) return;


      events =
        events.filter(
          event => event.id !== selectedEventId
        );


      localStorage.setItem(
        "calendarEvents",
        JSON.stringify(events)
      );


      closeModal();

      renderCalendar();

    }


    /* =========================
       Close Modal
    ========================= */

    function closeModal() {

      document.getElementById("modalOverlay")
        .style.display = "none";

    }


    /* Close modal when clicking outside */

    document.getElementById("modalOverlay")
      .addEventListener("click", function(e) {

        if (e.target === this) {
          closeModal();
        }

      });


    /* Start */

    renderCalendar();

  </script>

</body>
</html>
